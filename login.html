<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — Equipment Borrowing System</title>
<link rel="stylesheet" href="style.css" />
</head>
<body class="login-body">

  <div class="login-card">
    <h1>Equipment Borrowing<br />Monitoring System</h1>
    <p class="subtitle">Sign in to manage equipment and transactions</p>

    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" required placeholder="you@example.com" />

      <label for="password">Password</label>
      <input type="password" id="password" required placeholder="••••••••" />

      <p id="loginError" class="error-text"></p>

      <button type="submit" class="btn-primary btn-full">Log In</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="auth.js"></script>
</body>
</html>
